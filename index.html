function loadLocal(){
  let saved=[];
  try{saved=JSON.parse(localStorage.getItem(LS_KEY)||"[]")}catch(e){saved=[]}
  const map=new Map();
  BASE_DATA.forEach(d=>map.set(d.id,norm(d)));
  saved.forEach(d=>{if(d&&d.id)map.set(d.id,norm(d))});
  DATA=[...map.values()];
  initUI();render();
}
function persist(){
  const base=new Set(BASE_DATA.map(d=>d.id));
  const custom=DATA.filter(d=>!base.has(d.id)||d.follow).map(d=>({id:d.id,category:d.category,name:d.name,type:d.type,region:d.region,city:d.city,amount:d.amount,budget:d.budget,winner:d.winner,date:d.date,due:d.due,deadline:d.deadline,bidMethod:d.bidMethod,biz:d.biz,fit:d.fit,local:d.local,tags:d.tags,summary:d.summary,detail:d.detail,source:d.source,sourceUrl:d.sourceUrl,follow:d.follow}));
  try{localStorage.setItem(LS_KEY,JSON.stringify(custom))}catch(e){toast("本机存储写入失败："+e.message)}
}
function initUI(){
  $("tabs").innerHTML=Object.keys(CATS).map(k=>'<div class="tab'+(k===state.cat?" on":"")+'" onclick="setCat(\''+k+'\')">'+CATS[k]+'</div>').join("");
  const regs=[...new Set(DATA.map(d=>d.region).filter(Boolean))].sort();
  $("fRegion").innerHTML='<option value="">全部地区</option>'+regs.map(r=>'<option>'+r+'</option>').join("");
  const bizs=[...new Set(DATA.flatMap(d=>d.biz))].sort();
  $("fBiz").innerHTML='<option value="">全部业务</option>'+bizs.map(r=>'<option>'+r+'</option>').join("");
  $("fFit").innerHTML='<option value="">全部匹配</option>'+Object.keys(FIT).map(k=>'<option value="'+k+'">'+FIT[k]+'</option>').join("");
  const open=DATA.filter(d=>d.category==="open");
  $("sOpen").textContent=open.length;
  $("sUrgent").textContent=open.filter(d=>days(d)!==null&&days(d)<=7&&days(d)>=0).length;
  $("sFit").textContent=DATA.filter(d=>d.fit==="ok").length;
  $("sFollow").textContent=DATA.filter(d=>d.follow).length;
  $("sAll").textContent=DATA.length;
}
function setCat(c){state.cat=c;initUI();render()}
function filtered(){
  const k=state.kw.trim().toLowerCase();
  return DATA.filter(d=>{
    if(state.cat==="follow"){if(!d.follow)return false}else if(d.category!==state.cat)return false;
    if(k&&![d.name,d.region,d.city,d.winner,d.source,...d.tags,...d.biz].join(" ").toLowerCase().includes(k))return false;
    if(state.region&&d.region!==state.region)return false;
    if(state.biz&&!d.biz.includes(state.biz))return false;
    if(state.fit&&d.fit!==state.fit)return false;
    if(state.local&&!d.local)return false;
    if(state.urg){const n=days(d);if(n===null||n> +state.urg||n<0)return false}
    return true;
  }).sort((a,b)=>{const da=days(a),db=days(b);return (da===null?9999:da)-(db===null?9999:db)});
}
function tagCls(t){if(/资质完全对口|二级可投|无壹级|可投/.test(t))return"ok";if(/紧急|明日|今天|截止/.test(t))return"red";if(/本地|深圳|广东/.test(t))return"local";if(/门槛|壹级|需联合/.test(t))return"warn";return""}
function render(){
  const rows=filtered();$("showCount").textContent="显示 "+rows.length+" 条";
  if(!rows.length){$("list").innerHTML='<div class="empty">没有符合条件的项目</div>';return}
  $("list").innerHTML=rows.map(d=>{
    const n=days(d),u=urgency(d),de=decision(d);
    const cls=n===null?"":(n<=3?"urgent":(n<=7?"soon":""));
    return '<div class="card"><div class="top"><h3 onclick="detail(\''+d.id+'\')">'+esc(d.name)+'</h3><button class="star'+(d.follow?" on":"")+'" title="标记重点跟进" onclick="toggleFollow(\''+d.id+'\')">★</button></div>'+
    '<div class="meta"><span class="tag '+(d.fit==="ok"?"ok":(d.fit==="need1"?"warn":""))+'">'+FIT[d.fit]+'</span>'+(d.local?'<span class="tag local">广东本地</span>':'')+d.tags.slice(0,3).map(t=>'<span class="tag '+tagCls(t)+'">'+esc(t)+'</span>').join("")+'</div>'+
    '<div class="money">'+money(d)+' <small>'+(d.budget?"预算":"金额")+'</small></div>'+
    '<div class="summary">'+esc(d.summary||d.detail||"暂无摘要")+'</div>'+
    '<div class="foot"><span class="countdown '+cls+'">'+(n===null?"无截止时间":(n<0?"已过期":(n===0?"今天截止":(n===1?"明天截止":"剩 "+n+" 天"))))+' · '+de+'</span><span>'+esc(d.region)+(d.city?" · "+esc(d.city):"")+'</span></div></div>';
  }).join("");
}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function detail(id){
  const d=DATA.find(x=>x.id===id);if(!d)return;
  $("detailBody").innerHTML='<h2>'+esc(d.name)+'</h2><div class="meta">'+(d.fit==="ok"?'<span class="tag ok">'+FIT[d.fit]+'</span>':'<span class="tag warn">'+FIT[d.fit]+'</span>')+(d.local?'<span class="tag local">广东本地</span>':'')+'</div>'+
  '<div class="row"><b>预算 / 金额</b><div>'+money(d)+'</div></div><div class="row"><b>决策建议</b><div>'+decision(d)+' ｜ '+urgency(d)+' ｜ '+(days(d)!==null?days(d)+" 天":"无截止")+'</div></div>'+
  '<div class="row"><b>最近节点</b><div>'+esc(d.deadline||d.due||"—")+'</div></div>'+
  '<div class="row"><b>业务类型</b><div>'+esc(d.biz.join("、")||"—")+'</div></div>'+
  '<div class="row"><b>项目要点</b><div>'+esc(d.summary||"—")+'</div></div>'+
  '<div class="row"><b>注意事项 / 切入点</b><div>'+esc(d.detail||"—")+'</div></div>'+
  '<div class="row"><b>信息来源</b><div>'+esc(d.source||"—")+(d.sourceUrl?' ｜ <a href="'+esc(d.sourceUrl)+'" target="_blank">查看原文 ↗</a>':'')+'</div></div>';
  $("detailMask").classList.add("on");
}
function toggleFollow(id){
  const d=DATA.find(x=>x.id===id);if(!d)return;
  d.follow=!d.follow;
  persist();
  toast(d.follow?"已加入跟进表（保存在本机）":"已取消跟进");initUI();render();
}
function openAdd(){
  const fields=[["id","编号*"],["name","项目名称*"],["category","所属库"],["type","类型"],["region","地区"],["city","城市"],["amount","金额(万)"],["budget","预算(万)"],["winner","采购人/总包"],["date","发布日期"],["due","截止日期 YYYY-MM-DD"],["deadline","节点说明"],["fit","资质匹配"],["source","来源"],["sourceUrl","原文链接"]];
  $("addForm").innerHTML=fields.map(([k,l])=>'<div><label style="font-size:12px;color:var(--muted)">'+l+'</label>'+(k==="category"?'<select id="af_'+k+'"><option value="open">在招未截止</option><option value="yale">业务对口</option><option value="subcontract">总包分包</option><option value="quality">大型总包</option><option value="lowprice">低价案例</option></select>':(k==="fit"?'<select id="af_'+k+'"><option value="ok">资质对口可投</option><option value="need1">需壹级/高门槛</option><option value="track">跟踪机会</option></select>':'<input id="af_'+k+'">'))+'</div>').join('')+'<div style="grid-column:1/-1"><label style="font-size:12px;color:var(--muted)">业务类型(顿号分隔)</label><input id="af_biz"></div><div style="grid-column:1/-1"><label style="font-size:12px;color:var(--muted)">要点</label><input id="af_summary"></div><div style="grid-column:1/-1"><label style="font-size:12px;color:var(--muted)">注意事项/切入点</label><input id="af_detail"></div>';
  $("af_category").value="open";$("af_fit").value="ok";
  $("addMask").classList.add("on");
}
async function saveProject(){
  const g=k=>$("af_"+k)?$("af_"+k).value.trim():"";
  if(!g("id")||!g("name")){toast("编号和项目名称必填");return}
  const rec={id:g("id"),name:g("name"),category:g("category")||"open",type:g("type")||null,region:g("region")||null,city:g("city")||null,amount:Number(g("amount"))||0,budget:Number(g("budget"))||0,winner:g("winner")||null,date:g("date")||null,due:g("due")||null,deadline:g("deadline")||null,bidmethod:null,biz:JSON.stringify(g("biz")?g("biz").split(/[、,，]/).map(s=>s.trim()).filter(Boolean):[]),fit:g("fit")||"track",local:/广东|深圳|东莞|广州|珠海|佛山|惠州|江门|中山|湛江|清远|韶关|汕头/.test(g("region")+g("city")),tags:"[]",summary:g("summary")||null,detail:g("detail")||null,source:g("source")||null,sourceurl:g("sourceUrl")||null,follow:false};
  const item=norm(rec);const i=DATA.findIndex(x=>x.id===item.id);
  if(i>=0)DATA[i]=item;else DATA.push(item);
  persist();$("addMask").classList.remove("on");toast("已保存到本机浏览器");initUI();render();
}
function openImport(){$("importMask").classList.add("on")}
async function doImport(){
  let arr;try{arr=JSON.parse($("importJson").value)}catch(e){toast("JSON 格式错误");return}
  if(!Array.isArray(arr)){toast("请粘贴 JSON 数组");return}
  const recs=arr.map(r=>({id:r.id,category:r.category||"open",name:r.name||"未命名",type:r.type||null,region:r.region||null,city:r.city||null,amount:Number(r.amount)||0,budget:Number(r.budget)||0,winner:r.winner||null,date:r.date||null,due:r.due||null,deadline:r.deadline||null,bidmethod:r.bidMethod||null,biz:JSON.stringify(r.biz||[]),fit:r.fit||"track",local:!!r.local,tags:JSON.stringify(r.tags||[]),summary:r.summary||null,detail:r.detail||null,source:r.source||null,sourceurl:r.sourceUrl||null,follow:!!r.follow}));
  recs.forEach(r=>{const item=norm(r);const i=DATA.findIndex(x=>x.id===item.id);if(i>=0)DATA[i]=item;else DATA.push(item)});
  persist();$("importMask").classList.remove("on");toast("导入完成："+recs.length+" 条（保存在本机）");initUI();render();
}
function reload(){loadLocal()}

function exportRows(list){
  return list.map(d=>{const n=days(d);return[d.id,d.name,d.region+(d.city?" / "+d.city:""),d.budget?d.budget+"":"",d.amount?d.amount+"":"",d.due||"",n===null?"":String(n),urgency(d),FIT[d.fit],decision(d),d.biz.join("、"),d.local?"是":"否",d.tags.join("、"),d.bidMethod||"",d.deadline||"",d.summary||"",d.detail||"",d.source||"",d.sourceUrl||""]});
}
const HEAD=["编号","项目名称","地区","预算(万)","金额(万)","截止日","剩余天数","紧急度","资质匹配","决策建议","业务类型","本地","关键标签","招标方式","最近节点","项目要点","注意事项/切入点","来源","原文链接"];
function makeXlsx(rows,title,dashboard){
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([HEAD,...rows]);
  ws["!cols"]=[8,38,14,11,11,13,10,9,16,14,28,7,30,14,40,48,54,16,40].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,ws,"决策表");
  if(dashboard){
    const dec={},urg={};rows.forEach(r=>{dec[r[9]]=(dec[r[9]]||0)+1;urg[r[7]]=(urg[r[7]]||0)+1});
    const kpi=[["指标","数值"],["项目总数",rows.length],["广东本地",rows.filter(r=>r[11]==="是").length],["7天内需决策",rows.filter(r=>{const n=+r[6];return !isNaN(n)&&n>=0&&n<=7}).length],["资质对口",rows.filter(r=>r[8]==="资质对口可投").length],["披露预算合计(万)",rows.reduce((a,r)=>a+(Number(r[3])||0),0)],[],["决策建议","数量"],...Object.entries(dec),[],["紧急度","数量"],...Object.entries(urg)];
    const ws2=XLSX.utils.aoa_to_sheet(kpi);ws2["!cols"]=[{wch:22},{wch:14}];XLSX.utils.book_append_sheet(wb,ws2,"优先级看板");
  }
  const note=[["字段","说明"],["数据快照","2026-11-25，内置静态数据 + 本机浏览器保存"],["剩余天数","截止日减当天，自动计算"],["预算留空","公告未披露，不代表0元"],["决策建议","资质对口≤2天=立即行动，≤7天=优先投标"],["数据边界","搜索引擎收录且可核原文的公告，非平台全量库；以原平台最新公告为准"]];
  const ws3=XLSX.utils.aoa_to_sheet(note);ws3["!cols"]=[{wch:20},{wch:80}];XLSX.utils.book_append_sheet(wb,ws3,"字段说明");
  XLSX.writeFile(wb,title+".xlsx");
}
function exportDecision(){
  const list=DATA.filter(d=>d.category==="open").sort((a,b)=>(days(a)??9999)-(days(b)??9999));
  if(!list.length){toast("没有在招项目");return}
  makeXlsx(exportRows(list),"投标决策表_"+new Date().toISOString().slice(0,10),true);toast("已导出 "+list.length+" 条");
}
function exportFollow(){
  const list=DATA.filter(d=>d.follow).sort((a,b)=>(days(a)??9999)-(days(b)??9999));
  if(!list.length){toast("请先用星标标记重点跟进项目");return}
  makeXlsx(exportRows(list),"跟进项目表_"+new Date().toISOString().slice(0,10),true);toast("已导出 "+list.length+" 条");
}
["fKw","fRegion","fBiz","fFit","fUrg","fLocal"].forEach(id=>{
  const el=$(id);el.addEventListener(id==="fKw"?"input":"change",()=>{
    state.kw=$("fKw").value;state.region=$("fRegion").value;state.biz=$("fBiz").value;state.fit=$("fFit").value;state.urg=$("fUrg").value;state.local=$("fLocal").checked;render();
  });
});
loadLocal();
</script>
